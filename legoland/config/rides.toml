# =============================================================================
# LEGOLAND California rides registry.
#
#  kind = "coaster"  -> a TRACKED rail ride (Minecraft rail + minecart + display rig).
#                       `route` waypoints are snapped to a 4-connected grid; the rail
#                       engine derives each cell's shape (straight/curve/ascending) from
#                       neighbours. Rails are axis-aligned, max 1 block Y per cell, no
#                       powered rail on curves, boosters only on straight/ascending cells.
#  kind = "static"   -> a non-rideable themed structure (spinning/drop/flat ride) with
#                       optional cheap visual-only display-entity motion. Do NOT attempt
#                       rideable rotation/drop.
#
# Block coords are in the compressed world frame (config/transform.toml). Routes are
# DRAFT starting points for Phase 1+; the exact track is finalised when the land's
# terrain + structures exist (the route must stay on/above ground and reachable).
# =============================================================================

# ----------------------------------------------------------------------------- #
# COASTERS (rail rides)
# ----------------------------------------------------------------------------- #

[[rides]]
kind   = "coaster"
key    = "the_dragon"
name   = "The Dragon"
land   = "castle_hill"
mvp    = true                 # Phase 1 prototype rig (end-to-end before any roster)
desc   = "Family steel coaster: a slow indoor dark-ride through the castle past a fire-breathing dragon, then a lift hill and outdoor drops around the keep."
train_main = "red_concrete"   # dragon livery
train_trim = "gold_block"
train_accent = "lime_concrete"  # dragon green
# DRAFT route around the castle at Castle Hill centre (75,-110). Phase 1 (P1.4) refines:
# station -> indoor pass through the keep -> lift hill -> outdoor drops -> back to station.
# y is the target rail height; the grid clamps adjacent steps to +/-1 and snaps to 4-connected.
boarding = [60, 86, -96]
route = [
  [60, 86, -96],   # station / boarding
  [88, 86, -96],   # enter castle (indoor dark section, slow)
  [96, 87, -110],  # past the dragon show scene
  [96, 90, -124],  # lift hill (climb)
  [72, 90, -124],  # crest, outdoor
  [60, 87, -120],  # first drop
  [56, 86, -108],  # swoop around the keep
  [60, 86, -96],   # return to station (closes loop)
]

