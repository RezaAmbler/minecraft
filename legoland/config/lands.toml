# =============================================================================
# LEGOLAND California lands registry (the "locations" of the build).
#
# Block centres are in the compressed world frame defined by config/transform.toml
# (park centroid -> (0,0); +X east, +Z south; ~1.6 m/block). The three coaster
# anchors are EXACT (derived from GPS); all other land centres are APPROXIMATE,
# inferred from the official park map + the anchored geography (entrance NE on the
# hilltop, lands radiating around the central lake which sits low to the south).
# Refine per land as each is built. See docs/LEGOLAND_REFERENCE.md.
#
# `mvp = true` marks the land built in Phase 1 (Castle Hill only).
# `in_brief` records whether the land was in the original user brief; lands without
# it are real-park corrections added per decision LD5 (logged in DECISIONS.md).
# =============================================================================

[[lands]]
key       = "the_beginning"
name      = "The Beginning"
theme     = "Park entrance plaza, shops, ticketing, giant LEGO models"
palette   = ["red_concrete", "yellow_concrete", "blue_concrete", "white_concrete"]
center    = [60, -160]      # entrance, top of hill, north of Castle Hill
footprint = 110
in_brief  = true
mvp       = false

[[lands]]
key       = "castle_hill"
name      = "Castle Hill"
theme     = "Medieval kingdom: stone castle, banners, The Dragon coaster"
palette   = ["stone_bricks", "cobblestone", "dark_oak_planks", "red_wool", "blue_wool", "gold_block"]
center    = [75, -110]      # around The Dragon anchor (90, -106); highest, NE
footprint = 140
in_brief  = true
mvp       = true

